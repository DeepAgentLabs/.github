name: Coordinated release readiness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-manager
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - name: Check release gate negative controls
        run: python3 -m unittest discover -s release-manager/tests -v
      - name: Check out immutable candidates
        run: python3 release-manager/scripts/checkout_candidates.py --manifest release-manager/release/candidate.json --workspace candidates
      - name: Build and verify isolated wheels
        run: |
          cp release-manager/release/candidate.json release-manager/release/ci-candidate.json
          python3 release-manager/scripts/accept_ecosystem.py --manifest release-manager/release/ci-candidate.json --workspace candidates --output release-manager/release/evidence/ci-wheel-acceptance.json --record-evidence
      - name: Report all remaining acceptance gates
        run: python3 release-manager/scripts/release_readiness.py --manifest release-manager/release/ci-candidate.json > readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinated-readiness
          path: |
            release-manager/release/ci-candidate.json
            release-manager/release/evidence/ci-wheel-acceptance.json
            readiness.json
# This workflow never publishes. Publication must invoke --require-ready and
# verify the evidence attribution through the normal maintainer review process.
